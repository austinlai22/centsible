<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover exposes env(safe-area-inset-*) so the fixed bottom tab
      bar can clear the iPhone home indicator.

      Note what is NOT here: maximum-scale=1 and user-scalable=no. Those
      disabled pinch-zoom entirely, which fails WCAG 2.1 SC 1.4.4 (Resize
      Text) and is a genuine barrier for low-vision users — on a personal
      finance app where the content is numbers, that matters. iOS ignores
      user-scalable=no from iOS 10 onward anyway; Android honours it, so it
      was only ever breaking accessibility on Android.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F7F8" />
    <!-- SVG favicon: one file, sharp at every size, and it inherits the
         brand teal without shipping a PNG set. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="color-scheme" content="light" />
    <title>Centsible — make your money last the term</title>
    <meta name="description" content="Budgeting built for students on financial aid. See how long your money lasts — and the day it runs out. No ads, no data selling." />

    <!--
      Fonts are linked here rather than @import-ed from inside the app's
      injected <style>. An @import inside a stylesheet cannot begin
      downloading until that stylesheet itself has parsed, which serialises
      the request behind the JS bundle; a <link> with preconnect starts the
      handshake during initial HTML parse instead.
      display=swap renders fallback text immediately rather than blocking.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <!--
      Content-Security-Policy — governs what the BROWSER will allow this page
      to load. Each allowance maps to something the app genuinely needs:
        fonts.googleapis.com / fonts.gstatic.com  → Fraunces + DM Sans
        cdn.plaid.com                             → Plaid Link SDK + iframe
        connect-src 'self' + your API origin      → fetch() calls to the backend

      __API_ORIGIN__ is substituted at build time by the csp-api-origin plugin
      in vite.config.js, from VITE_API_URL. It used to be a hardcoded
      http://localhost:3001 with a comment asking the developer to remember to
      change it — which is exactly how a build ships with the browser blocking
      every API call. The failure mode is nasty: CORS on the backend is fine,
      so it presents as an unexplained network error rather than a policy one.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta>
      CSP. It is set as a real response header in nginx.conf instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        script-src 'self' https://cdn.plaid.com;
        connect-src 'self' https://cdn.plaid.com https://*.plaid.com __API_ORIGIN__;
        frame-src https://cdn.plaid.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

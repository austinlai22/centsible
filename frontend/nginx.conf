server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # frame-ancestors lives here rather than in index.html's meta CSP because
    # browsers ignore that directive when it arrives via <meta> — it is only
    # honoured as a real response header. Without it the app can be framed by
    # any site, which is the setup for a clickjacking attack against a
    # logged-in session.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Deny sensors this app never uses, so a compromised dependency can't ask.
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Serve pre-compressed assets when the client supports it.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Single-page app fallback: any path that isn't a real static file
    # falls back to index.html so React's client-side state (which is just
    # in-memory tabs here, not a router, but this is still correct practice)
    # and a hard refresh on any URL both work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively — Vite fingerprints filenames,
    # so a new deploy always produces new filenames and never serves stale
    # cached JS to a returning user.
    #
    # The security headers are REPEATED in both blocks below on purpose. nginx
    # does not merge add_header directives across levels: the moment a
    # location block declares any add_header of its own, it replaces the
    # entire inherited set rather than adding to it. Without these repeats,
    # /assets/ and /index.html would silently ship with Cache-Control and none
    # of the security headers above — and index.html is exactly the response
    # that needs frame-ancestors.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;
    }

    # Never let CDNs/browsers cache index.html itself — it must always be
    # fetched fresh so it always references the current build's assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;
    }
}
